name: daily

on:
  schedule:
    # 8h00 à Paris = 06:00 UTC (été) ou 07:00 UTC (hiver) : le script choisit
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Envoyer maintenant, même hors créneau"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: data-writer        # partagé avec collect.yml
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # dernier état, pas le commit du déclenchement (run en file d'attente)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récap quotidien
        run: python src/daily.py ${{ inputs.force && '--force' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          POLY_ADDR_1: ${{ secrets.POLY_ADDR_1 }}
          POLY_ADDR_2: ${{ secrets.POLY_ADDR_2 }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}   # facultatif

      - name: Commit de l'état
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "Rien à commiter"; exit 0; fi
          git commit -q -m "state: récap $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
