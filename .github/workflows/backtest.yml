name: backtest

# Lancement manuel : Actions → backtest → Run workflow. Lecture seule, aucun ordre.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r backtest/requirements.txt
      - name: Backtest sur l'historique horaire (API CLOB)
        run: python backtest/run.py --fetch
      - run: python backtest/report.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest
          path: backtest/out/
