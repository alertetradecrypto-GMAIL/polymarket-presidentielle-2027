name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer        # partagé avec daily.yml : jamais deux écritures en même temps
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # dernier état, pas le commit du déclenchement (run en file d'attente)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des prix
        run: python src/collect.py

      - name: Contrôle de volatilité
        run: python src/volatility.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      # Tweet d'alerte : seulement si volatility.py a mis un tweet en attente
      # (Chromium n'est installé que dans ce cas).
      - name: Tweet d'alerte
        id: xalert
        if: ${{ !cancelled() && hashFiles('out/x_alert.json') != '' }}
        continue-on-error: true    # un échec X ne doit jamais bloquer la sauvegarde des données
        run: |
          pip install -r requirements-x.txt
          python -m playwright install --with-deps chromium
          python src/x_alerts.py
        env:
          DRY_RUN: ${{ vars.X_LIVE == '1' && '0' || '1' }}   # publication réelle si X_LIVE = 1
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      # Tweet de classement : seulement si l'ordre du Top 5 a changé (confirmé sur
      # 2 collectes, 2 h mini entre deux tweets, plafond de 3/jour avec les alertes).
      - name: Contrôle du Top 5
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python src/x_top5.py check

      - name: Tweet de classement
        if: ${{ !cancelled() && hashFiles('out/x_top5.json') != '' }}
        continue-on-error: true
        run: |
          pip install "tweepy>=4.14,<5"
          python src/x_top5.py post
        env:
          DRY_RUN: ${{ vars.X_LIVE == '1' && '0' || '1' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Visuel d'alerte en artefact
        if: ${{ !cancelled() && hashFiles('out/x_alert_*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: x-alert-${{ github.run_id }}
          path: |
            out/x_alert_*.png
            out/x_alert_*.txt
          retention-days: 14

      - name: Actualités des candidats (1 fois par heure)
        if: ${{ !cancelled() }}
        continue-on-error: true   # une panne de la source d'actualités ne bloque rien
        timeout-minutes: 4
        run: python src/news.py

      - name: Commit des données
        if: ${{ !cancelled() }}   # on sauvegarde données et état même si l'email a échoué
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "Rien à commiter"; exit 0; fi
          git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
