name: collect

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writer        # partagé avec daily.yml : jamais deux écritures en même temps
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # dernier état, pas le commit du déclenchement (run en file d'attente)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des prix
        run: python src/collect.py

      - name: Contrôle de volatilité
        run: python src/volatility.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      - name: Commit des données
        if: ${{ !cancelled() }}   # on sauvegarde données et état même si l'email a échoué
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "Rien à commiter"; exit 0; fi
          git commit -q -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
