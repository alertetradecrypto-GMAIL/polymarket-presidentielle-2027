name: fetch-event

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug de l'événement Polymarket"
        default: presidential-election-winner-2024
      fidelity:
        description: "Minutes par point (60 = horaire, 1440 = quotidien)"
        default: "60"
      min_volume:
        description: "Volume minimum d'un candidat (USD)"
        default: "100000"

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Téléchargement de l'historique
        run: python src/fetch_closed_event.py "${{ inputs.slug }}" --fidelity "${{ inputs.fidelity }}" --min-volume "${{ inputs.min_volume }}"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/events
          if git diff --cached --quiet; then echo "Rien à commiter"; exit 0; fi
          git commit -q -m "backtest: historique ${{ inputs.slug }}"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
